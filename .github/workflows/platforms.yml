name: platforms

on:
  workflow_dispatch:

jobs:
  test-platform:
    strategy:
      matrix:
        runs-on-name: ['windows-latest']
        flutter-version: ['3.27.4']

    runs-on: ${{ matrix.runs-on-name }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '${{ matrix.flutter-version }}'
          channel: 'stable'

      # Resolves every package in the workspace in a single shared resolution.
      - name: Get flutter packages
        run: flutter pub get

      - name: Run the driver test
        working-directory: packages/upgrader/example
        run: flutter drive --target=test/driver_test/driver.dart --driver=test/driver_test/driver_test.dart

      - name: Upload Screenshots to Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-platform-${{ matrix.runs-on-name }}-${{ matrix.flutter-version }}
          path: packages/upgrader/example/test/driver_test/screenshots/*
