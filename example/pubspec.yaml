version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_ui: ^1.0.0
  device_info_plus: ^11.0.0
  go_router: ^18.0.0
  http: ^1.2.2
  material_ui: ^1.0.0
  path: ^1.9.0

  upgrader:
    path: ../
  version: ^3.0.2

dev_dependencies:
  flutter_driver:
    sdk: flutter

  flutter_lints:

  flutter_test:
    sdk: flutter

  test:

flutter:
  uses-material-design: true
