name: upgrader_core
description: Dart-only core upgrade engine and store lookup support for upgrader.
version: 14.0.0
homepage: https://github.com/larryaasen/upgrader
repository: https://github.com/larryaasen/upgrader
issue_tracker: https://github.com/larryaasen/upgrader/issues

environment:
  sdk: '>=3.6.0 <4.0.0'

resolution: workspace

dependencies:
  html: ^0.15.3
  http: '>=0.13.6 <2.0.0'
  version: ^3.0.2
  xml: '>=6.3.0 <8.0.0'

dev_dependencies:
  mockito: ^5.4.3
  # Kept compatible with the test_api version pinned by flutter_test in the
  # Flutter SDK, since this package shares a workspace resolution with upgrader.
  test: '>=1.24.0 <2.0.0'
